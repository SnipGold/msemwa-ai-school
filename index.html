<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msemwa AI School</title>

<style>
body{
font-family:Arial,sans-serif;
background:#08152f;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

#chat{
height:420px;
overflow:auto;
border:1px solid #35507a;
padding:15px;
border-radius:15px;
background:#091a38;
margin-bottom:15px;
}

.input{
display:flex;
gap:10px;
}

input{
flex:1;
padding:14px;
border-radius:12px;
border:none;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:14px 22px;
border-radius:12px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>Msemwa AI School</h1>

<div id="chat"></div>

<div class="input">
<input id="message" placeholder="Andika swali..." onkeypress="if(event.key==='Enter') send()">
<button onclick="send()">Tuma</button>
</div>

</div>

<script>
const chat = document.getElementById("chat");

function add(sender, text) {
  chat.innerHTML += `<p><b>${sender}:</b> ${text}</p>`;
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById("message");
  const message = input.value.trim();

  if (!message) return;

  add("Wewe", message);
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    add("Msemwa AI", data.reply || "Hakuna jibu.");

await fetch("/api/signal", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    symbol: "GBPUSD",
    signal: "BUY",
    score: 95,
    entry: 1.3500,
    sl: 1.3470,
    tp1: 1.3530,
    tp2: 1.3560
  })
});
    
  } catch (err) {
    add("Msemwa AI", "Tatizo la kuwasiliana na server.");
    console.error(err);
  }
}
</script>

</body>
</html>
